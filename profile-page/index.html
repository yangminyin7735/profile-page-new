<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简介</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft Yahei}
        body{background-color:#f0f4f8;padding:40px}
        .card{max-width:600px;margin:0 auto;background:rgb(255, 255, 255);border-radius:16px;padding:32px;box-shadow:0 4px 12px #00000015}
        .avatar{width:120px;height:120px;border-radius:50%;background:#cadcf4;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#345888}
        h1{text-align:center;color:#222;margin-bottom:12px}
        .info{color:#666;text-align:center;margin-bottom:24px;line-height:1.6}
        h3{margin:20px 0 8px;color:#333}
        ul{padding-left:20px;color:#555;line-height:1.8}
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👤</div>
        <h1>杨敏茵</h1>
        <div class="info">
            一名前端新手 | 正在学习网页开发
        </div>
        <h3>个人简介</h3>
        <p>我是一名学生，刚开始接触学习网页制作，这次作业练习HTML和CSS与项目部署流程，学习如何把网页部署到公网。</p>
        <h3>爱好</h3>
        <ul>
            <li>玩游戏</li>
            <li>听音乐</li>
            <li>看电影</li>
            <li>打羽毛球</li>
        </ul>
    </div>
</body>
</html>
